</main>

<script>


/* =========================
   KIỂM TRA ADMIN
========================= */

function checkAdmin() {

    const admin =
        localStorage.getItem(
            "khanhmod_admin"
        );


    if (admin !== "1") {

        const password =
            prompt(
                "Nhập mật khẩu Admin:"
            );


        if (
            password !== "khanhmod2008"
        ) {

            alert(
                "Sai mật khẩu Admin!"
            );

            window.location.href =
                "index.html";

            return false;

        }


        localStorage.setItem(
            "khanhmod_admin",
            "1"
        );

    }


    return true;

}



/* =========================
   LẤY DANH SÁCH USER
========================= */

function getUsers() {

    let users = [];


    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    "khanhmod_users"
                ) || "[]"
            );


        if (Array.isArray(data)) {

            users = data;

        }

    } catch (e) {

        users = [];

    }



    /*
       Tương thích tài khoản cũ.
    */

    let oldUser = null;


    try {

        oldUser =
            JSON.parse(
                localStorage.getItem(
                    "khanhmod_user"
                ) || "null"
            );

    } catch (e) {

        oldUser = null;

    }



    if (
        oldUser &&
        oldUser.username
    ) {

        const exists =
            users.some(function(user) {

                return String(
                    user.username || ""
                ).toLowerCase() ===
                String(
                    oldUser.username || ""
                ).toLowerCase();

            });


        if (!exists) {

            users.push(oldUser);

        }

    }



    localStorage.setItem(
        "khanhmod_users",
        JSON.stringify(users)
    );


    return users;

}



/* =========================
   LƯU DANH SÁCH USER
========================= */

function saveUsers(users) {

    localStorage.setItem(
        "khanhmod_users",
        JSON.stringify(users)
    );


    let currentUser = null;


    try {

        currentUser =
            JSON.parse(
                localStorage.getItem(
                    "khanhmod_user"
                ) || "null"
            );

    } catch (e) {

        currentUser = null;

    }



    if (currentUser) {

        const updated =
            users.find(function(user) {

                return String(
                    user.username || ""
                ).toLowerCase() ===
                String(
                    currentUser.username || ""
                ).toLowerCase();

            });


        if (updated) {

            localStorage.setItem(
                "khanhmod_user",
                JSON.stringify(updated)
            );

        }

    }

}



/* =========================
   HIỂN THỊ YÊU CẦU NẠP TIỀN
========================= */

function renderRequests() {

    const box =
        document.getElementById(
            "requests"
        );


    let requests = [];


    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    "khanhmod_topup_requests"
                ) || "[]"
            );


        if (Array.isArray(data)) {

            requests = data;

        }

    } catch (e) {

        requests = [];

    }



    if (
        requests.length === 0
    ) {

        box.innerHTML =
            '<p class="muted">Chưa có yêu cầu nạp tiền.</p>';

        return;

    }



    box.innerHTML =
        requests.map(
            function(request, index) {

                return `

                <div style="
                    padding:15px;
                    margin-bottom:12px;
                    border:1px solid rgba(0,255,255,.25);
                    border-radius:12px;
                ">


                    <h3>

                        👤 ${escapeHTML(
                            request.username || ""
                        )}

                    </h3>


                    <p>

                        💰 Số tiền:

                        <b>

                            ${Number(
                                request.amount || 0
                            ).toLocaleString(
                                "vi-VN"
                            )}đ

                        </b>

                    </p>


                    <p>

                        🕐 ${escapeHTML(
                            request.time || ""
                        )}

                    </p>


                    <p>

                        📌 Trạng thái:

                        <b>

                            ${escapeHTML(
                                request.status || ""
                            )}

                        </b>

                    </p>


                    ${
                        request.status ===
                        "Chờ Admin xác nhận"

                        ?

                        `

                        <button
                            class="btn btn-yellow"
                            onclick="approveRequest(${index})"
                        >
                            ✅ Duyệt
                        </button>


                        <button
                            class="btn btn-dark"
                            onclick="rejectRequest(${index})"
                        >
                            ❌ Từ chối
                        </button>

                        `

                        :

                        ""

                    }

                </div>

                `;

            }
        ).join("");

}



/* =========================
   DUYỆT NẠP TIỀN
========================= */

function approveRequest(index) {

    let requests = [];


    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    "khanhmod_topup_requests"
                ) || "[]"
            );


        if (Array.isArray(data)) {

            requests = data;

        }

    } catch (e) {

        requests = [];

    }



    const request =
        requests[index];


    if (!request) {

        return;

    }



    if (
        request.status !==
        "Chờ Admin xác nhận"
    ) {

        return;

    }



    const users =
        getUsers();


    const userIndex =
        users.findIndex(
            function(user) {

                return String(
                    user.username || ""
                ).toLowerCase() ===
                String(
                    request.username || ""
                ).toLowerCase();

            }
        );



    if (
        userIndex === -1
    ) {

        alert(
            "Không tìm thấy tài khoản người dùng."
        );

        return;

    }



    users[userIndex].balance =
        Number(
            users[userIndex].balance || 0
        ) +
        Number(
            request.amount || 0
        );


    request.status =
        "Đã duyệt";


    saveUsers(users);


    localStorage.setItem(
        "khanhmod_topup_requests",
        JSON.stringify(requests)
    );



    alert(
        "Đã cộng " +
        Number(
            request.amount || 0
        ).toLocaleString("vi-VN") +
        "đ vào tài khoản " +
        request.username
    );



    renderRequests();

    renderUsers();

}



/* =========================
   TỪ CHỐI NẠP TIỀN
========================= */

function rejectRequest(index) {

    let requests = [];


    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    "khanhmod_topup_requests"
                ) || "[]"
            );


        if (Array.isArray(data)) {

            requests = data;

        }

    } catch (e) {

        requests = [];

    }



    if (
        !requests[index]
    ) {

        return;

    }



    requests[index].status =
        "Đã từ chối";


    localStorage.setItem(
        "khanhmod_topup_requests",
        JSON.stringify(requests)
    );


    renderRequests();

}



/* =========================
   HIỂN THỊ ĐƠN HÀNG
========================= */

function renderOrders() {

    const box =
        document.getElementById(
            "orders"
        );


    if (!box) {

        return;

    }



    let orders = [];


    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    "khanhmod_orders"
                ) || "[]"
            );


        if (Array.isArray(data)) {

            orders = data;

        }

    } catch (e) {

        orders = [];

    }



    if (
        orders.length === 0
    ) {

        box.innerHTML =
            '<p class="muted">Chưa có đơn hàng nào.</p>';

        return;

    }



    /*
       Hiển thị đơn hàng mới nhất trước.
    */

    orders =
        orders.slice().reverse();



    box.innerHTML =
        orders.map(
            function(order, reverseIndex) {

                return `

                <div style="
                    padding:18px;
                    margin-bottom:15px;
                    border:1px solid rgba(0,255,255,.25);
                    border-radius:14px;
                    background:rgba(255,255,255,.03);
                ">


                    <h3>

                        🛍️ ${escapeHTML(
                            order.product ||
                            "Sản phẩm"
                        )}

                    </h3>


                    <p>

                        👤 Người mua:

                        <b>

                            ${escapeHTML(
                                order.username ||
                                "Không xác định"
                            )}

                        </b>

                    </p>


                    ${
                        order.name

                        ?

                        `

                        <p>

                            👨 Tên hiển thị:

                            <b>

                                ${escapeHTML(
                                    order.name
                                )}

                            </b>

                        </p>

                        `

                        :

                        ""

                    }


                    <p>

                        💰 Giá:

                        <b>

                            ${Number(
                                order.price || 0
                            ).toLocaleString(
                                "vi-VN"
                            )}đ

                        </b>

                    </p>


                    <p>

                        🕐 Thời gian:

                        ${escapeHTML(
                            order.time || ""
                        )}

                    </p>


                    <p>

                        📌 Trạng thái:

                        <b style="
                            color:#00ff99;
                        ">

                            ${escapeHTML(
                                order.status ||
                                "Đã thanh toán"
                            )}

                        </b>

                    </p>


                </div>

                `;

            }
        ).join("");

}



/* =========================
   HIỂN THỊ USER
========================= */

function renderUsers() {

    const box =
        document.getElementById(
            "users"
        );


    const users =
        getUsers();



    if (
        users.length === 0
    ) {

        box.innerHTML =
            '<p class="muted">Chưa có người dùng.</p>';

        return;

    }



    box.innerHTML =
        users.map(
            function(user, index) {

                return `

                <div style="
                    padding:18px;
                    margin-bottom:15px;
                    border:1px solid rgba(0,255,255,.25);
                    border-radius:14px;
                ">


                    <h3>

                        👤 ${escapeHTML(
                            user.name ||
                            user.username ||
                            "Người dùng"
                        )}

                    </h3>


                    <p>

                        Username:

                        <b>

                            ${escapeHTML(
                                user.username || ""
                            )}

                        </b>

                    </p>


                    <p>

                        💰 Số dư:

                        <b>

                            ${Number(
                                user.balance || 0
                            ).toLocaleString(
                                "vi-VN"
                            )}đ

                        </b>

                    </p>


                    <div style="
                        display:flex;
                        flex-wrap:wrap;
                        gap:8px;
                        margin-top:12px;
                    ">


                        <button
                            class="btn btn-yellow"
                            onclick="addMoney(${index})"
                        >

                            ➕ Cộng tiền

                        </button>


                        <button
                            class="btn btn-dark"
                            onclick="subtractMoney(${index})"
                        >

                            ➖ Trừ tiền

                        </button>


                    </div>


                </div>

                `;

            }
        ).join("");

}



/* =========================
   CỘNG TIỀN
========================= */

function addMoney(index) {

    const users =
        getUsers();


    const user =
        users[index];


    if (!user) {

        return;

    }



    const amount =
        prompt(
            "Nhập số tiền muốn cộng cho " +
            user.username +
            ":"
        );


    if (
        amount === null
    ) {

        return;

    }



    const money =
        Number(
            amount.replace(/,/g, "")
        );



    if (
        !Number.isFinite(money) ||
        money <= 0
    ) {

        alert(
            "Số tiền không hợp lệ!"
        );

        return;

    }



    user.balance =
        Number(
            user.balance || 0
        ) +
        money;


    saveUsers(users);


    alert(
        "Đã cộng " +
        money.toLocaleString(
            "vi-VN"
        ) +
        "đ cho " +
        user.username
    );


    renderUsers();

}



/* =========================
   TRỪ TIỀN
========================= */

function subtractMoney(index) {

    const users =
        getUsers();


    const user =
        users[index];


    if (!user) {

        return;

    }



    const amount =
        prompt(
            "Nhập số tiền muốn trừ của " +
            user.username +
            ":"
        );


    if (
        amount === null
    ) {

        return;

    }



    const money =
        Number(
            amount.replace(/,/g, "")
        );



    if (
        !Number.isFinite(money) ||
        money <= 0
    ) {

        alert(
            "Số tiền không hợp lệ!"
        );

        return;

    }



    const currentBalance =
        Number(
            user.balance || 0
        );



    if (
        money > currentBalance
    ) {

        alert(
            "Số dư không đủ để trừ!"
        );

        return;

    }



    user.balance =
        currentBalance -
        money;


    saveUsers(users);


    alert(
        "Đã trừ " +
        money.toLocaleString(
            "vi-VN"
        ) +
        "đ của " +
        user.username
    );


    renderUsers();

}



/* =========================
   CHỐNG HTML LỖI
========================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================
   ĐĂNG XUẤT ADMIN
========================= */

function adminLogout() {

    localStorage.removeItem(
        "khanhmod_admin"
    );


    window.location.href =
        "index.html";

}



/* =========================
   KHỞI ĐỘNG
========================= */

if (checkAdmin()) {

    renderRequests();

    renderOrders();

    renderUsers();

}


</script>
