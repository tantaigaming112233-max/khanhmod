</main>

<script>


/* =========================
   KIỂM TRA ADMIN
========================= */

function checkAdmin() {

    const admin =
        localStorage.getItem(
            "khanhmod_admin"
        );


    if (admin !== "1") {

        const password =
            prompt(
                "Nhập mật khẩu Admin:"
            );


        if (
            password !== "KhánhMod@2026"
        ) {

            alert(
                "Sai mật khẩu Admin!"
            );

            window.location.href =
                "index.html";

            return false;

        }


        localStorage.setItem(
            "khanhmod_admin",
            "1"
        );

    }


    return true;

}



/* =========================
   LẤY DANH SÁCH USER
========================= */

function getUsers() {

    let users =
        JSON.parse(
            localStorage.getItem(
                "khanhmod_users"
            ) || "[]"
        );


    /*
       Tương thích với hệ thống cũ:
       Nếu chỉ có khanhmod_user
       thì tự đưa tài khoản đó
       vào danh sách nhiều user.
    */

    if (
        users.length === 0
    ) {

        const oldUser =
            JSON.parse(
                localStorage.getItem(
                    "khanhmod_user"
                ) || "null"
            );


        if (oldUser) {

            users = [
                oldUser
            ];

            localStorage.setItem(
                "khanhmod_users",
                JSON.stringify(users)
            );

        }

    }


    return users;

}



/* =========================
   LƯU DANH SÁCH USER
========================= */

function saveUsers(users) {

    localStorage.setItem(
        "khanhmod_users",
        JSON.stringify(users)
    );


    /*
       Cập nhật tài khoản hiện tại
       để hệ thống cũ vẫn hoạt động.
    */

    const currentUser =
        JSON.parse(
            localStorage.getItem(
                "khanhmod_user"
            ) || "null"
        );


    if (currentUser) {

        const updated =
            users.find(
                function(user) {

                    return (
                        user.username ===
                        currentUser.username
                    );

                }
            );


        if (updated) {

            localStorage.setItem(
                "khanhmod_user",
                JSON.stringify(updated)
            );

        }

    }

}



/* =========================
   HIỂN THỊ YÊU CẦU NẠP TIỀN
========================= */

function renderRequests() {

    const box =
        document.getElementById(
            "requests"
        );


    const requests =
        JSON.parse(
            localStorage.getItem(
                "khanhmod_topup_requests"
            ) || "[]"
        );


    if (
        requests.length === 0
    ) {

        box.innerHTML =
            '<p class="muted">Chưa có yêu cầu nạp tiền.</p>';

        return;

    }


    box.innerHTML =
        requests.map(
            function(request, index) {

                return `

                <div style="
                    padding:15px;
                    margin-bottom:12px;
                    border:1px solid rgba(0,255,255,.25);
                    border-radius:12px;
                ">

                    <h3>
                        👤 ${escapeHTML(request.username)}
                    </h3>


                    <p>
                        💰 Số tiền:
                        <b>
                            ${Number(request.amount || 0)
                            .toLocaleString("vi-VN")}đ
                        </b>
                    </p>


                    <p>
                        🕐 ${escapeHTML(request.time || "")}
                    </p>


                    <p>
                        📌 Trạng thái:
                        <b>
                            ${escapeHTML(request.status || "")}
                        </b>
                    </p>


                    ${
                        request.status ===
                        "Chờ Admin xác nhận"

                        ?

                        `

                        <button
                            class="btn btn-yellow"
                            onclick="approveRequest(${index})"
                        >
                            ✅ Duyệt
                        </button>


                        <button
                            class="btn btn-dark"
                            onclick="rejectRequest(${index})"
                        >
                            ❌ Từ chối
                        </button>

                        `

                        :

                        ""

                    }

                </div>

                `;

            }
        ).join("");

}



/* =========================
   DUYỆT NẠP TIỀN
========================= */

function approveRequest(index) {

    const requests =
        JSON.parse(
            localStorage.getItem(
                "khanhmod_topup_requests"
            ) || "[]"
        );


    const request =
        requests[index];


    if (!request) {

        return;

    }


    if (
        request.status !==
        "Chờ Admin xác nhận"
    ) {

        return;

    }


    const users =
        getUsers();


    const userIndex =
        users.findIndex(
            function(user) {

                return (
                    user.username ===
                    request.username
                );

            }
        );


    if (userIndex === -1) {

        alert(
            "Không tìm thấy tài khoản người dùng."
        );

        return;

    }


    users[userIndex].balance =
        Number(
            users[userIndex].balance || 0
        ) +
        Number(
            request.amount || 0
        );


    request.status =
        "Đã duyệt";


    saveUsers(users);


    localStorage.setItem(
        "khanhmod_topup_requests",
        JSON.stringify(requests)
    );


    alert(
        "Đã cộng " +
        Number(request.amount || 0)
        .toLocaleString("vi-VN") +
        "đ vào tài khoản " +
        request.username
    );


    renderRequests();

    renderUsers();

}



/* =========================
   TỪ CHỐI NẠP TIỀN
========================= */

function rejectRequest(index) {

    const requests =
        JSON.parse(
            localStorage.getItem(
                "khanhmod_topup_requests"
            ) || "[]"
        );


    if (!requests[index]) {

        return;

    }


    requests[index].status =
        "Đã từ chối";


    localStorage.setItem(
        "khanhmod_topup_requests",
        JSON.stringify(requests)
    );


    renderRequests();

}



/* =========================
   HIỂN THỊ NHIỀU USER
========================= */

function renderUsers() {

    const box =
        document.getElementById(
            "users"
        );


    const users =
        getUsers();


    if (
        users.length === 0
    ) {

        box.innerHTML =
            '<p class="muted">Chưa có người dùng.</p>';

        return;

    }


    box.innerHTML =
        users.map(
            function(user, index) {

                return `

                <div style="
                    padding:18px;
                    margin-bottom:15px;
                    border:1px solid rgba(0,255,255,.25);
                    border-radius:14px;
                ">

                    <h3>
                        👤 ${escapeHTML(
                            user.name ||
                            user.username ||
                            "Người dùng"
                        )}
                    </h3>


                    <p>
                        Username:
                        <b>
                            ${escapeHTML(
                                user.username || ""
                            )}
                        </b>
                    </p>


                    <p>
                        💰 Số dư:
                        <b>
                            ${Number(
                                user.balance || 0
                            ).toLocaleString("vi-VN")}đ
                        </b>
                    </p>


                    <div style="
                        display:flex;
                        flex-wrap:wrap;
                        gap:8px;
                        margin-top:12px;
                    ">

                        <button
                            class="btn btn-yellow"
                            onclick="addMoney(${index})"
                        >
                            ➕ Cộng tiền
                        </button>


                        <button
                            class="btn btn-dark"
                            onclick="subtractMoney(${index})"
                        >
                            ➖ Trừ tiền
                        </button>

                    </div>

                </div>

                `;

            }
        ).join("");

}



/* =========================
   CỘNG TIỀN
========================= */

function addMoney(index) {

    const users =
        getUsers();


    const user =
        users[index];


    if (!user) {

        return;

    }


    const amount =
        prompt(
            "Nhập số tiền muốn cộng cho " +
            user.username +
            ":"
        );


    if (
        amount === null
    ) {

        return;

    }


    const money =
        Number(
            amount.replace(/,/g, "")
        );


    if (
        !Number.isFinite(money) ||
        money <= 0
    ) {

        alert(
            "Số tiền không hợp lệ!"
        );

        return;

    }


    user.balance =
        Number(user.balance || 0) +
        money;


    saveUsers(users);


    alert(
        "Đã cộng " +
        money.toLocaleString("vi-VN") +
        "đ cho " +
        user.username
    );


    renderUsers();

}



/* =========================
   TRỪ TIỀN
========================= */

function subtractMoney(index) {

    const users =
        getUsers();


    const user =
        users[index];


    if (!user) {

        return;

    }


    const amount =
        prompt(
            "Nhập số tiền muốn trừ của " +
            user.username +
            ":"
        );


    if (
        amount === null
    ) {

        return;

    }


    const money =
        Number(
            amount.replace(/,/g, "")
        );


    if (
        !Number.isFinite(money) ||
        money <= 0
    ) {

        alert(
            "Số tiền không hợp lệ!"
        );

        return;

    }


    const currentBalance =
        Number(
            user.balance || 0
        );


    if (
        money > currentBalance
    ) {

        alert(
            "Số dư không đủ để trừ!"
        );

        return;

    }


    user.balance =
        currentBalance -
        money;


    saveUsers(users);


    alert(
        "Đã trừ " +
        money.toLocaleString("vi-VN") +
        "đ của " +
        user.username
    );


    renderUsers();

}



/* =========================
   CHỐNG HTML LỖI
========================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =========================
   ĐĂNG XUẤT
========================= */

function adminLogout() {

    localStorage.removeItem(
        "khanhmod_admin"
    );


    window.location.href =
        "index.html";

}



/* =========================
   KHỞI ĐỘNG
========================= */

if (checkAdmin()) {

    renderRequests();

    renderUsers();

}


</script>
