<body>

<main class="page">

```
<div class="container">


    <h1 class="title">
        Tạo tài khoản
    </h1>


    <p class="subtitle">
        Tạo tài khoản để quản lý số dư và đơn hàng
    </p>



    <div class="panel form-panel">


        <label for="name">
            Tên hiển thị
        </label>


        <input
            id="name"
            type="text"
            placeholder="Ví dụ: Văn Khánh"
        >



        <label for="username">
            Tên đăng nhập
        </label>


        <input
            id="username"
            type="text"
            placeholder="Ví dụ: khanhmod"
        >



        <label for="password">
            Mật khẩu
        </label>


        <input
            id="password"
            type="password"
            placeholder="Ít nhất 6 ký tự"
        >



        <label for="password2">
            Nhập lại mật khẩu
        </label>


        <input
            id="password2"
            type="password"
            placeholder="Nhập lại mật khẩu"
        >



        <div
            id="error"
            class="error"
        ></div>


        <div
            id="success"
            class="success"
        ></div>



        <button
            type="button"
            class="btn btn-primary full"
            onclick="register()"
        >

            Tạo tài khoản

        </button>



        <p class="small">

            Đã có tài khoản?

            <a href="login.html">
                Đăng nhập
            </a>

        </p>



        <div class="note">

            Tài khoản hiện được lưu trên trình duyệt của thiết bị này.

        </div>


    </div>


</div>
```

</main>

<script>


/* =========================
   ĐĂNG KÝ TÀI KHOẢN
========================= */

function register() {


    const nameInput =
        document.getElementById(
            "name"
        );


    const usernameInput =
        document.getElementById(
            "username"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const password2Input =
        document.getElementById(
            "password2"
        );


    const error =
        document.getElementById(
            "error"
        );


    const success =
        document.getElementById(
            "success"
        );



    const displayName =
        nameInput.value.trim();


    const username =
        usernameInput.value
        .trim()
        .toLowerCase();


    const password =
        passwordInput.value;


    const password2 =
        password2Input.value;



    error.style.display =
        "none";


    success.style.display =
        "none";



    /* =========================
       KIỂM TRA DỮ LIỆU
    ========================== */

    if (
        !displayName ||
        !username ||
        !password ||
        !password2
    ) {

        error.textContent =
            "Vui lòng nhập đầy đủ thông tin.";


        error.style.display =
            "block";


        return;

    }



    if (
        username.length < 3
    ) {

        error.textContent =
            "Tên đăng nhập phải có ít nhất 3 ký tự.";


        error.style.display =
            "block";


        return;

    }



    if (
        password.length < 6
    ) {

        error.textContent =
            "Mật khẩu phải có ít nhất 6 ký tự.";


        error.style.display =
            "block";


        return;

    }



    if (
        password !== password2
    ) {

        error.textContent =
            "Mật khẩu nhập lại không khớp.";


        error.style.display =
            "block";


        return;

    }



    /* =========================
       LẤY DANH SÁCH USER
    ========================== */

    let users =
        JSON.parse(
            localStorage.getItem(
                "khanhmod_users"
            ) || "[]"
        );



    /*
       Nếu hệ thống cũ có tài khoản
       nhưng chưa có khanhmod_users
       thì chuyển tài khoản đó vào
       danh sách mới.
    */

    if (
        users.length === 0
    ) {

        const oldUser =
            JSON.parse(
                localStorage.getItem(
                    "khanhmod_user"
                ) || "null"
            );


        if (
            oldUser &&
            oldUser.username
        ) {

            users.push(
                oldUser
            );

        }

    }



    /* =========================
       KIỂM TRA USERNAME
    ========================== */

    const exists =
        users.some(
            function(user) {

                return (
                    String(
                        user.username || ""
                    ).toLowerCase() ===
                    username
                );

            }
        );



    if (exists) {

        error.textContent =
            "Tên đăng nhập này đã tồn tại.";


        error.style.display =
            "block";


        return;

    }



    /* =========================
       TẠO USER MỚI
    ========================== */

    const user = {

        name:
            displayName,

        username:
            username,

        password:
            password,

        balance:
            0

    };



    /* =========================
       THÊM VÀO DANH SÁCH
    ========================== */

    users.push(
        user
    );



    localStorage.setItem(
        "khanhmod_users",
        JSON.stringify(users)
    );



    /*
       Lưu tài khoản vừa đăng ký
       để hệ thống đăng nhập hiện tại
       tiếp tục tương thích.
    */

    localStorage.setItem(
        "khanhmod_user",
        JSON.stringify(user)
    );



    localStorage.setItem(
        "khanhmod_logged",
        "0"
    );



    /* =========================
       THÔNG BÁO
    ========================== */

    success.textContent =
        "Tạo tài khoản thành công! Đang chuyển sang đăng nhập...";


    success.style.display =
        "block";



    /* =========================
       CHUYỂN ĐẾN LOGIN
    ========================== */

    setTimeout(
        function() {

            window.location.href =
                "login.html";

        },
        1000
    );


}


</script>

</body>

</html>
