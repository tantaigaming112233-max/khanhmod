```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tạo tài khoản - KhánhMod</title>

<link rel="stylesheet" href="account.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<nav class="nav">
    <div class="nav-inner">

        <a class="brand" href="index.html">
            <img src="images/logo.png" alt="KhánhMod">
            KhánhMod
        </a>

        <div class="links">
            <a href="index.html">Trang chủ</a>
            <a href="login.html">Đăng nhập</a>
        </div>

    </div>
</nav>


<div class="account-container">

    <div class="account-card">

        <h1>📝 Tạo tài khoản</h1>

        <p class="subtitle">
            Tạo tài khoản để quản lý số dư và đơn hàng
        </p>


        <form id="registerForm">

            <label>Tên hiển thị</label>

            <input
                type="text"
                id="displayName"
                placeholder="Nhập tên hiển thị"
                required
            >


            <label>Tên tài khoản</label>

            <input
                type="text"
                id="username"
                placeholder="Nhập tên tài khoản"
                autocomplete="username"
                required
            >


            <label>Mật khẩu</label>

            <input
                type="password"
                id="password"
                placeholder="Nhập mật khẩu"
                autocomplete="new-password"
                required
            >


            <label>Nhập lại mật khẩu</label>

            <input
                type="password"
                id="password2"
                placeholder="Nhập lại mật khẩu"
                autocomplete="new-password"
                required
            >


            <button
                type="submit"
                class="login-btn"
            >
                Tạo tài khoản
            </button>

        </form>


        <div
            id="message"
            style="
                margin-top:15px;
                text-align:center;
                display:none;
            "
        ></div>


        <p style="text-align:center;margin-top:20px;">
            Đã có tài khoản?
            <a href="login.html">Đăng nhập</a>
        </p>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://ubiduyjflmcaltxyjurt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_TfYxyV5vkaaQzOQX55IOKw_-3jvRgNS";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const form =
    document.getElementById(
        "registerForm"
    );


const message =
    document.getElementById(
        "message"
    );


function showMessage(
    text,
    success
) {

    message.style.display = "block";

    message.textContent = text;

    message.style.color =
        success
        ? "#00ff99"
        : "#ff5555";
}


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const displayName =
            document
                .getElementById("displayName")
                .value
                .trim();


        const username =
            document
                .getElementById("username")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        const password2 =
            document
                .getElementById("password2")
                .value;


        if (!displayName) {

            showMessage(
                "Vui lòng nhập tên hiển thị.",
                false
            );

            return;
        }


        if (!/^[a-z0-9_]{3,20}$/.test(username)) {

            showMessage(
                "Tên tài khoản chỉ được dùng chữ không dấu, số và dấu _. Ví dụ: khanh123",
                false
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Mật khẩu phải có ít nhất 6 ký tự.",
                false
            );

            return;
        }


        if (password !== password2) {

            showMessage(
                "Mật khẩu nhập lại không khớp.",
                false
            );

            return;
        }


        showMessage(
            "Đang tạo tài khoản...",
            true
        );


        try {

            /*
             * Chuyển username thành email nội bộ.
             * Người dùng không cần nhập email.
             */

            const email =
                username +
                "@khanhmod.com";


            /*
             * Tạo tài khoản Supabase
             */

            const result =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password

                });


            const data =
                result.data;

            const error =
                result.error;


            if (error) {

                console.error(error);

                showMessage(
                    "Supabase: " +
                    error.message,
                    false
                );

                return;
            }


            if (!data || !data.user) {

                showMessage(
                    "Không nhận được thông tin tài khoản từ Supabase.",
                    false
                );

                return;
            }


            /*
             * Tạo hồ sơ người dùng
             */

            const profileResult =
                await supabaseClient
                    .from("profiles")
                    .insert({

                        id: data.user.id,

                        username: username,

                        display_name: displayName,

                        balance: 0

                    });


            if (profileResult.error) {

                console.error(
                    profileResult.error
                );

                showMessage(
                    "Tài khoản Auth đã tạo nhưng hồ sơ bị lỗi: " +
                    profileResult.error.message,
                    false
                );

                return;
            }


            showMessage(
                "✅ Tạo tài khoản thành công!",
                true
            );


            setTimeout(
                function() {

                    window.location.href =
                        "login.html";

                },
                1200
            );

        }

        catch (error) {

            console.error(error);

            showMessage(
                "Lỗi kết nối Supabase: " +
                error.message,
                false
            );

        }

    }
);

</script>

</body>
</html>
```
