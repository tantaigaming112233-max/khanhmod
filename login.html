<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - KhánhMod</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#0d0d0d;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,sans-serif;
}

.login-box{
    width:350px;
    background:#1b1b1b;
    padding:30px;
    border-radius:15px;
    border:2px solid #00cfff;
    box-shadow:0 0 20px #00cfff;
}

h2{
    color:#00cfff;
    text-align:center;
    margin-bottom:20px;
}

.form-control{
    margin-bottom:15px;
}

.btn-login{
    width:100%;
    background:#00cfff;
    color:white;
    font-weight:bold;
}

.btn-login:hover{
    background:#00aacc;
}
</style>

</head>
<body>

<div class="login-box">

<h2>Đăng nhập</h2>

<input type="text" id="username" class="form-control" placeholder="Tên đăng nhập">

<input type="password" id="password" class="form-control" placeholder="Mật khẩu">

<button class="btn btn-login" onclick="login()">
Đăng nhập
</button>
<p class="text-center mt-3">
    Chưa có tài khoản?
</p>

<a href="register.html" class="btn btn-success w-100">
    Tạo tài khoản
</a>
</div>

<script>
function login(){

let user=document.getElementById("username").value;
let pass=document.getElementById("password").value;

if(user==="KhanhMod" && pass==="9999"){
    alert("Đăng nhập thành công!");
    window.location="index.html";
}else{
    alert("Sai tài khoản hoặc mật khẩu!");
}

}
</script>

</body>
</html>
