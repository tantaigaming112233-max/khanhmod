<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - KhánhMod</title>
<link rel="stylesheet" href="account.css">

<style>
.login-box {
    max-width: 420px;
    margin: 80px auto;
    padding: 25px;
}

.login-box h1 {
    text-align: center;
    margin-bottom: 25px;
}

.login-box input {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    border-radius: 10px;
    border: 1px solid #00eaff;
    background: #0b111a;
    color: white;
    box-sizing: border-box;
}

.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #00eaff;
    color: #000;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:active {
    transform: scale(0.98);
}

#error {
    display: none;
    color: #ff4d4d;
    text-align: center;
    margin-top: 15px;
}

.register-link {
    text-align: center;
    margin-top: 20px;
}
</style>

</head>

<body>

<nav class="nav">
    <div class="nav-inner">
        <a class="brand" href="index.html">
            <img src="images/logo.png" width="40" height="40">
            KhánhMod
        </a>

```
    <div class="links">
        <a href="index.html">Trang chủ</a>
        <a href="register.html">Tạo tài khoản</a>
    </div>
</div>
```

</nav>

<div class="login-box">

```
<h1>🔐 Đăng nhập</h1>

<input
    type="text"
    id="username"
    placeholder="Tên đăng nhập"
    autocomplete="username"
>

<input
    type="password"
    id="password"
    placeholder="Mật khẩu"
    autocomplete="current-password"
>

<button type="button" class="login-btn" onclick="login()">
    Đăng nhập
</button>

<div id="error"></div>

<div class="register-link">
    Chưa có tài khoản?
    <a href="register.html">Tạo tài khoản</a>
</div>
```

</div>

<script>

function loadUsers() {

    let users = [];

    // Đọc danh sách tài khoản
    try {
        const data = localStorage.getItem("khanhmod_users");

        if (data) {
            const parsed = JSON.parse(data);

            if (Array.isArray(parsed)) {
                users = parsed;
            }
        }
    } catch (e) {
        users = [];
    }

    // Lấy tài khoản cũ nếu có
    let oldUser = null;

    try {
        oldUser = JSON.parse(
            localStorage.getItem("khanhmod_user") || "null"
        );
    } catch (e) {
        oldUser = null;
    }

    // Đưa tài khoản cũ vào danh sách nếu chưa có
    if (oldUser && oldUser.username) {

        const exists = users.some(user =>
            String(user.username || "").toLowerCase() ===
            String(oldUser.username || "").toLowerCase()
        );

        if (!exists) {
            users.push(oldUser);
        }
    }

    localStorage.setItem(
        "khanhmod_users",
        JSON.stringify(users)
    );

    return users;
}


function login() {

    const usernameInput =
        document.getElementById("username");

    const passwordInput =
        document.getElementById("password");

    const error =
        document.getElementById("error");

    const username =
        usernameInput.value.trim().toLowerCase();

    const password =
        passwordInput.value;

    error.style.display = "none";
    error.textContent = "";

    if (!username || !password) {

        error.textContent =
            "Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.";

        error.style.display = "block";

        return;
    }

    const users = loadUsers();

    const user = users.find(item =>

        String(item.username || "").toLowerCase() === username
        &&
        String(item.password || "") === password

    );

    if (!user) {

        error.textContent =
            "Tên đăng nhập hoặc mật khẩu không đúng.";

        error.style.display = "block";

        return;
    }

    // Lưu tài khoản đang đăng nhập
    localStorage.setItem(
        "khanhmod_user",
        JSON.stringify(user)
    );

    localStorage.setItem(
        "khanhmod_logged",
        "1"
    );

    // Chuyển sang trang tài khoản
    window.location.href = "account.html";
}

</script>

</body>
</html>
