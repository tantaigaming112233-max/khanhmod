<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập - KhánhMod</title><link rel="stylesheet" href="account.css"></head><body>
<nav class="nav"><div class="nav-inner"><a class="brand" href="index.html"><img src="images/logo.png">KhánhMod</a><div class="links"><a href="index.html">Trang chủ</a><a href="register.html">Tạo tài khoản</a></div></div></nav>
<main class="page"><div class="container"><h1 class="title">Đăng nhập</h1><p class="subtitle">Đăng nhập vào tài khoản KhánhMod của bạn</p>
<div class="panel form-panel"><label>Tên đăng nhập</label><input id="username" autocomplete="username" placeholder="Nhập tên đăng nhập"><label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu"><div id="error" class="error"></div><button class="btn btn-primary full" onclick="login()">Đăng nhập</button><p class="small">Chưa có tài khoản? <a href="register.html">Tạo tài khoản</a></p></div></div></main>
<script>
function login(){const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value,e=document.getElementById('error');const user=JSON.parse(localStorage.getItem('khanhmod_user')||'null');if(!u||!p){e.textContent='Vui lòng nhập đầy đủ thông tin.';e.style.display='block';return}if(!user||user.username!==u||user.password!==p){e.textContent='Tên đăng nhập hoặc mật khẩu không đúng.';e.style.display='block';return}localStorage.setItem('khanhmod_logged','1');location.href='account.html'}
</script></body></html>
